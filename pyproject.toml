[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrec"
version = "0.1.0"
description = "A black-box flight recorder for PyTorch training runs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "FlightRec contributors"}]
dependencies = [
  "torch>=2.2",
  "numpy",
  "scipy",
  "scikit-learn",
  "plotly",
  "ruptures",
]

[project.optional-dependencies]
case-studies = ["torchvision"]
dev = ["pytest", "ruff", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

